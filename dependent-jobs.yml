name: Task 1 - Creating dependent jobs workflow

on:
  push:
    branches:
      - master
jobs:
  build_application:
    name: Building Java Ant application
    runs-on: ubuntu-latest
    steps:
    - name: Print build message
      run: echo "Building application..."

    - name: Sleep for 30 seconds
      run: sleep 30s

  test_application:
    name: Testing application after first job
    needs: build_application
    runs-on: ubuntu-latest
    steps:
    - name: Simulating tests
      run: echo "Running tests..."

    - name: Show test completion message
      run: echo "Testing completed successfully."

  deploy_application:
    name: Deploy Java application after testing
    needs: test_application
    runs-on: ubuntu-latest
    steps:
    - name: Starting deployment of application
      run: echo "Deploying application..."

    - name: Show deployment completion message
      run: echo "Deployment completed successfully."
